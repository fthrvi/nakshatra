syntax = "proto3";

package nakshatra.v0_1;

// v0.1 service surface. See docs/v0.1-implementation-plan.md §3.5 for the
// full rationale; in short:
//   - Info: capability handshake at session start (model id, layer range, headroom)
//   - Forward: stateless single forward pass over the worker's layers (testing aid)
//   - Inference: stateful bidirectional stream, one per session_id
//
// Wire dtype is fp16 by default. Activation transport is always full-precision;
// no on-wire quantization in v0.1.

service Nakshatra {
  rpc Info(InfoRequest) returns (InfoResponse);
  rpc Forward(ForwardRequest) returns (ForwardResponse);
  rpc Inference(stream InferenceStep) returns (stream InferenceStep);
  // Speculative decoding (slice 1): discard a rejected speculative tail from this
  // worker's KV. The coordinator fans this out to EVERY worker after accept().
  rpc TruncateKV(TruncateRequest) returns (TruncateResponse);
  // 2026-06-21 sleep-mode: release/re-acquire the GPU without a process respawn.
  // Sleep frees the daemon's ctx+model weights (keeps the process + ROCm backend
  // resident); Wake reloads from the warm page cache (~440ms vs ~7.5s cold).
  // Additive — older workers simply don't implement these; the lifecycle probes
  // protocol_capabilities ("sleep_wake") before using them.
  rpc Sleep(SleepRequest) returns (SleepResponse);
  rpc Wake(WakeRequest) returns (WakeResponse);
  // 2026-09-04 participation: a worker signs, with its OWN mesh key, the stage it
  // actually served — turning a receipt's participation from COORDINATOR-ASSERTED into
  // holder-of-key PROVEN. Until this existed, "who worked" was a claim by the one party
  // with a motive to lie, and a stranger's node could serve but could never be paid.
  //
  // Called ONCE PER WORKER, AFTER generation, and it cannot be otherwise: the signed
  // message binds output_sha256, which covers the WHOLE run's output and does not exist
  // until the last token is out. A worker that finished its layers on token 1 of 400 has
  // nothing to sign yet — which is why this cannot ride on ForwardResponse or the
  // Inference stream.
  //
  // Additive: a worker that does not implement it returns UNIMPLEMENTED, the coordinator
  // records no signature for that stage, and the receipt stays signed_by="coordinator" as
  // before. Old and new nodes interoperate for as long as a rollout takes.
  rpc SignParticipation(SignParticipationRequest) returns (SignParticipationResponse);
}

message InfoRequest {}

message InfoResponse {
  string protocol_version    = 1;   // semver, e.g. "0.1.0"
  string backend             = 2;   // e.g. "llamacpp-rocm", "llamacpp-vulkan"
  string model_id            = 3;   // e.g. "llama-3.3-70b-q4-k-m"
  bytes  model_content_hash  = 4;   // sha256 of the source full GGUF
  int32  layer_start         = 5;
  int32  layer_end           = 6;   // half-open [start, end)
  int32  hidden_size         = 7;
  string wire_dtype          = 8;   // "f16" (v0.1 default), "f32"
  int32  kv_cache_tokens_free = 9;
  bool   has_token_embd      = 10;  // worker 0 only
  bool   has_lm_head         = 11;  // last worker only
  // v0.5 §9.1 closure — capability handshake. Clients reading an older
  // worker get an empty list and assume base v0.1 behaviour (Forward only,
  // no streaming/push/idempotency). Known tokens:
  //   "streaming"          — Inference RPC implemented
  //   "rpc_push"           — server-to-server push via NextServer/chain
  //   "idempotency_cache"  — (session_id, step_id) replay cache
  //   "recovery_replay"    — supports cold-prefill of a (prompt + already-
  //                          generated-tokens) replay after recovery
  //   "sleep_wake"         — Sleep/Wake RPCs (GPU release/re-acquire, 2026-06-21)
  //   "eagle_hidden"       — ForwardRequest.eagle_hidden returns draft hidden states
  //   "stream_spec"        — InferenceStep.all_logits honoured on the streaming
  //                          Inference RPC (speculative decode on the stream, 2026-07-29)
  repeated string protocol_capabilities = 12;
}

message ForwardRequest {
  bytes  hidden_in     = 1;          // raw bytes, shape [batch, n_tokens, hidden_size] in wire_dtype
  int32  batch         = 2;
  int32  n_tokens      = 3;
  bool   has_token_ids = 4;          // if true, hidden_in is actually token IDs (worker 0 path)
  bool   keep_kv       = 5;          // streaming: don't clear KV cache before decode (set true on steps after the prefill)
  int32  start_pos     = 6;          // streaming: position of the first token in the worker's KV cache
  // Speculative verify (slice 1): request the greedy argmax at EVERY position, not
  // just the last. Default false → legacy single-final-token behaviour, unchanged.
  // On the last worker, hidden_out then carries int32 top_token[n_tokens].
  bool   all_logits    = 7;
  // 2026-06-21 EAGLE→live: when true, the worker runs daemon cmd=5 (EAGLE_HIDDEN)
  // instead of a normal forward and returns the captured pre-final hidden states
  // (float32 [n_tokens, 3, hidden_size] — embd/l_out-0/l_out-1) for the draft head.
  // Default false → normal forward, unchanged. Set only on the FIRST worker by an
  // --eagle-head client; the head consumes these to propose tokens.
  bool   eagle_hidden  = 8;
}

message ForwardResponse {
  bytes hidden_out = 1;
}

// Speculative decoding: truncate this worker's KV to keep positions [0, n_keep),
// discarding the rejected speculative tail. Driven by daemon cmd=4 (KV_TRUNCATE).
message TruncateRequest {
  int32 n_keep = 1;   // number of leading KV positions to keep for seq 0
}

message TruncateResponse {}

// 2026-06-21 sleep-mode control messages (empty bodies; status is conveyed by
// gRPC success/failure + the daemon's wake-latency log line).
message SleepRequest  {}
message SleepResponse {}
message WakeRequest   {}
message WakeResponse  { double wake_seconds = 1; }   // 0 if already awake

message InferenceStep {
  string session_id     = 1;         // stable across the stream
  string step_id        = 2;         // idempotency key for retries
  int32  prefix_length  = 3;         // tokens already in KV cache before this step

  oneof payload {
    HiddenState hidden_state = 10;   // hidden state going *into* this worker's layer range
    TokenIds    token_ids    = 11;   // worker 0 input: token IDs to embed
    Logits      logits       = 12;   // last worker output: final logits over vocab
    bytes       error        = 13;   // serialized error string when something goes wrong
  }

  // v0.5 M0.5.3 — server-to-server push. When `next_server` (v1) or `chain`
  // (v2) carries a downstream worker, after we produce the output activation
  // we open (or reuse) a gRPC Inference stream to that peer and push the
  // hidden_state there. We then wait for the peer's response and yield it
  // back up to our own caller — the response chain unwinds backward.
  //
  // v1 (`next_server`): single immediate-next worker. Sufficient for 2-worker
  //   chains. Kept for back-compat; v2 clients should prefer `chain`.
  // v2 (`chain`): repeated NextServer listing the FULL remaining chain after
  //   the current worker. Each worker uses chain[0] as the immediate next and
  //   forwards chain[1:] to it. The final worker in the chain receives chain=[]
  //   and behaves as mode=last (returns token_id). Enables 3+ worker push.
  NextServer next_server = 14;
  bool       pushed      = 15;       // true when this step arrived via push, not direct from client
  repeated NextServer chain = 16;    // v2: full remaining chain; head = immediate next; pop on forward

  // Speculative decoding ON THE STREAM (2026-07-29): request the greedy argmax at
  // EVERY position, not just the last — the streaming twin of ForwardRequest.all_logits
  // (field 7), so a verify traversal can ride the persistent Inference stream instead of
  // paying unary Forward's per-call setup on every one of K+1 positions. Default false ->
  // legacy single-final-token behaviour, byte-identical to today. On the last worker with
  // all_logits=true, the response's token_ids.ids carries one argmax per input position
  // (length == the step's token/hidden count) instead of a single id. Non-last workers are
  // unaffected — they keep returning hidden_state either way. Older workers silently ignore
  // this field (proto3), so the client MUST refuse stream-spec unless every worker in the
  // chain advertises the "stream_spec" capability (see InfoResponse.protocol_capabilities) —
  // otherwise an old worker would return a single token where K+1 were expected, corrupting
  // accept() silently instead of failing loud.
  bool       all_logits  = 17;
}

message NextServer {
  string address    = 1;   // host:port of the next worker (e.g. "203.0.113.14:5562")
  string session_id = 2;   // session_id the next worker should use (may differ from caller's)
}

message TokenIds    { repeated int32 ids = 1; }
message HiddenState { bytes raw = 1; int32 batch = 2; int32 n_tokens = 3; }
message Logits      { bytes raw = 1; int32 vocab_size = 2; }

// ── participation (2026-09-04) ────────────────────────────────────────────────────────
message SignParticipationRequest {
  string run_id        = 1;
  // The sha256 over the WHOLE run's generated tokens. Known only after generation ends,
  // which is what forces this to be a separate, post-run call.
  string output_sha256 = 2;
  // What the COORDINATOR believes this worker served. Advisory only — see the response.
  int32  layer_start   = 3;
  int32  layer_end     = 4;
}

message SignParticipationResponse {
  string node_id = 1;
  string pubkey  = 2;
  // ⚠️⚠️ WHAT THE WORKER BELIEVES IT SERVED, AND IT SIGNS THIS, NOT THE REQUEST'S CLAIM.
  // If the coordinator asks it to attest [0,32) and it served [0,13), it returns [0,13) —
  // and the mismatch then shows up in signature_coverage as a gap, which is exactly the
  // detector that exists for it. A worker that echoed the requested span would turn its
  // key into a rubber stamp and make the whole exercise decorative.
  int32  layer_start = 3;
  int32  layer_end   = 4;
  // base64 Ed25519 over "{run_id}|{node_id}|[{a},{b})|{output_sha256}" — the SAME frozen
  // canonical every existing receipt uses. This adds a way to TRANSPORT a signature; it
  // changes nothing about what a signature IS.
  string sig = 5;
}
